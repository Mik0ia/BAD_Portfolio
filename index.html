<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Game Dev & Game Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Haut de l'accueil : liens + profil (sur mobile : liens à gauche, profil à droite) -->
  <div class="haut-accueil">

  <!-- Profil -->
  <aside class="profil">
    <div class="profil-photo">
      <img id="profilPhoto" alt="Photo de profil">
      <span class="pastille-profil" id="profilStatut"></span>
    </div>
    <div class="profil-nom" id="profilNom"></div>
    <div class="xp">
      <div class="xp-remplissage" id="xpBarre"></div>
      <span class="xp-niveau" id="xpNiveau"></span>
    </div>
    <a class="btn-profil" href="#">&rarr; PROFIL &larr;</a>
    <!-- Actualités (actus.js) : mégaphone + pastille rouge tant qu'elles n'ont pas été ouvertes -->
    <button class="btn-actus non-lu" id="btnActus" type="button" data-tip="Actualités" aria-label="Actualités (nouveautés)" hidden>
      <svg viewBox="0 0 32 32" fill="none" stroke="#6b2e00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h5l11-6v20l-11-6H5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 5 12z" fill="#ff8a1f"/>
        <path d="M10.5 20l1.7 6.5h3.8l-1.4-5.4" fill="#ffd9b0"/>
        <path d="M24.5 12a5 5 0 0 1 0 8"/>
        <path d="M27.5 9a9 9 0 0 1 0 14"/>
      </svg>
      <span class="notif" id="actusNotif"></span>
    </button>
  </aside>

  <!-- Bloc "Liens" (liens_accueil.js) : à gauche, au-dessus des cartouches. Fermé par défaut ; la flèche l'ouvre / le ferme -->
  <div class="liens-accueil" id="liensAccueil" hidden>
    <button class="liens-titre entree" id="liensTitre" type="button" aria-expanded="false" aria-controls="liensListe">
      <span>Liens</span>
      <span class="liens-fleche" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div class="liens-corps">
      <nav class="liens-liste" id="liensListe" aria-label="Liens"></nav>
    </div>
  </div>

  </div>

  <!-- Catégories + cartouches -->
  <main class="panneau">
    <nav class="onglets" id="onglets"></nav>
    <section class="grille" id="grille"></section>
    <div class="pj-barre grille-barre cache" id="grilleBarre" aria-hidden="true"><div class="pj-pouce" id="grillePouce"></div></div>   <!-- mobile : barre de défilement du menu -->
  </main>

  <!-- Vitrine : grosse cartouche 3D + description (au survol d'une cartouche) -->
  <div class="vitrine" id="vitrine">
    <div class="scene">
      <div class="ombre"></div>
      <div class="cart3d" id="cart3d">
        <div class="flotte"><div class="cart-rot" id="cartRot"></div></div>
      </div>
    </div>
    <div class="desc">
      <div class="desc-titre" id="descTitre"></div>
      <p class="desc-texte" id="descTexte"></p>
    </div>
  </div>

  <!-- Page profil -->
  <section class="page-profil" id="pageProfil" aria-hidden="true">
    <button class="btn-fermer" id="btnFermer" type="button" aria-label="Retour à l'accueil"></button>
    <!-- Gauche : avatar, ombre, pastille de dispo, bulle de dialogue, cadre métier -->
    <div class="pp-avatar-zone">
      <div class="pp-perso">
        <div class="pp-avatar-wrap" tabindex="0">
          <div class="bulle-dialogue" id="ppBulle"></div>
          <div class="ombre-avatar"></div>
          <img id="ppAvatar" alt="Avatar de Benjamin">
          <span class="pastille-profil" id="ppStatut"></span>
        </div>
        <div class="pp-metier" id="ppMetier"></div>
        <!-- tableau des médailles : toutes celles de tous les projets, or > argent > bronze (rempli automatiquement) -->
        <div class="pp-medailles" id="ppMedailles" hidden>
          <div class="hof-titre">&#9733; HALL OF FAME &#9733;</div>
          <div class="hof-zone">
            <div class="hof-grille" id="ppMedaillesGrille"></div>
            <div class="pj-barre hof-barre cache" id="hofBarre" aria-hidden="true"><div class="pj-pouce" id="hofPouce"></div></div>
          </div>
          <div class="hof-ciel" id="ppCiel" aria-hidden="true"></div>   <!-- étoiles qui brillent devant tout le cadre -->
        </div>
      </div>
    </div>

    <!-- Droite : nom + CV, barre d'XP, cadre Stats (le cadre Skills viendra en dessous) -->
    <div class="pp-droite">
      <div class="pp-ligne-nom">
        <h1 class="pp-nom" id="ppNom"></h1>
        <a class="btn-cv" id="ppCv" href="#" target="_blank" rel="noopener" download data-tip="Télécharger le CV" aria-label="Télécharger le CV">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M4 20h16"/>
          </svg>
        </a>
      </div>
      <div class="xp xp-grande">
        <div class="xp-remplissage" id="ppXpBarre"></div>
        <span class="xp-niveau" id="ppXpNiveau"></span>
      </div>
      <!-- seule zone qui défile : Stats + Skills (barre cartoon à droite) -->
      <div class="pp-zone-defile">
      <div class="pp-defile" id="ppDefile">
      <div class="panneau-profil">
        <h2 class="section-titre">- STATS -</h2>
        <div class="jauges" id="ppJauges"></div>
        <div class="brutes" id="ppBrutes"></div>
      </div>
      <!-- cadre Skills : séparé du cadre Stats -->
      <div class="panneau-profil panneau-skills">
        <h2 class="section-titre">- SKILLS -</h2>
        <div class="skills" id="ppSkills"></div>
      </div>
      </div>
      <div class="pj-barre pp-barre cache" id="ppBarre" aria-hidden="true"><div class="pj-pouce" id="ppPouce"></div></div>
      </div>
    </div>
  </section>

  <!-- Page projet (style Wii : cadre d'écran + flèches) -->
  <section class="page-projet" id="pageProjet" aria-hidden="true">
    <div class="pj-defile" id="pjDefile">
    <div class="pj-contenu" id="pjContenu">
      <!-- 1) cadre catégorie -->
      <div class="pj-categorie" id="pjType"></div>

      <!-- 2) cadre présentation : cartouche + pastille | nom + description -->
      <div class="pj-cadre-pres">
        <div class="pj-visuel">
          <img id="pjImage" alt="">
          <span class="pastille" id="pjPastille"></span>
          <div class="medailles" id="pjMedailles"></div>
        </div>
        <div class="pj-infos">
          <div class="pj-boite pj-nom" id="pjTitre"></div>
          <div class="pj-boite pj-desc" id="pjDesc"></div>
        </div>
      </div>

      <!-- 3) cadre vidéo : disparaît s'il n'y a pas de lien YouTube -->
      <div class="pj-cadre-video" id="pjVideoCadre" hidden>
        <div class="pj-video">
          <iframe id="pjVideo" title="Vidéo de présentation" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </div>

      <!-- 4) cadre texte : le texte du jeu (textes.js), disparaît s'il est vide -->
      <div class="pj-cadre-texte" id="pjTexteCadre" hidden>
        <div class="pj-boite pj-texte" id="pjTexte"></div>
      </div>

      <!-- 5) cadre liens : les boutons de liens.js, disparaît s'il n'y en a aucun -->
      <div class="pj-cadre-liens" id="pjLiensCadre" hidden></div>

    </div>
    </div>
    <div class="pj-cadre"></div>
    <div class="pj-barre cache" id="pjBarre" aria-hidden="true"><div class="pj-pouce" id="pjPouce"></div></div>
    <button class="btn-fermer" id="pjFermer" type="button" aria-label="Retour à l'accueil"></button>
    <button class="fleche gauche" id="pjPrec" type="button" aria-label="Jeu précédent"></button>
    <button class="fleche droite" id="pjSuiv" type="button" aria-label="Jeu suivant"></button>
    <div class="pj-compteur" id="pjCompteur"></div>

    <!-- commentaire du jeu : l'avatar apparaît en bas à droite quand on a scrollé tout en bas -->
    <div class="pj-commentaire" id="pjCommentaire" aria-live="polite">
      <div class="bulle-dialogue pj-bulle" id="pjCommentaireBulle"></div>
      <img id="pjCommentaireImg" alt="">
    </div>
  </section>

  <!-- Page Actualités (même cadre d'écran que la page d'un jeu) : cartes remplies par actus.js -->
  <section class="page-projet page-actus" id="pageActus" aria-hidden="true">
    <div class="pj-defile" id="actusDefile">
      <div class="pj-contenu" id="actusContenu">
        <div class="pj-categorie">Actualités</div>
        <div class="act-liste" id="actusListe"></div>
      </div>
    </div>
    <div class="pj-cadre"></div>
    <div class="pj-barre cache" id="actusBarre" aria-hidden="true"><div class="pj-pouce" id="actusPouce"></div></div>
    <button class="btn-fermer" id="actFermer" type="button" aria-label="Retour à l'accueil"></button>
  </section>

  <!-- Zoom d'image (clic sur une image du texte d'un jeu) : page floutée + image en grand, clic ailleurs = fermer -->
  <div id="zoomImage" aria-hidden="true"><img id="zoomImg" alt=""></div>

  <!-- Fondu (noir pour ouvrir/fermer un projet, blanc pour changer de jeu) -->
  <div id="fondu" aria-hidden="true"></div>

  <!-- Rideau de transition entre les pages -->
  <div id="rideau" aria-hidden="true">
    <div class="centre">
      <div class="burst-pop" id="rBurst"><div class="burst"></div></div>
      <div class="badge" id="rBadge"></div>
    </div>
  </div>

  <div id="bulle"></div>
  <div id="bulleLien" role="tooltip"></div>   <!-- bulle de BD des boutons de liens de l'accueil (sort à droite) -->
  <div id="bulleMedaille" role="tooltip"></div>   <!-- bulle de BD des médailles (page du jeu) -->

  <script src="projets.js"></script>
  <script src="textes.js"></script>
  <script src="liens.js"></script>
  <script src="liens_accueil.js"></script>
  <script src="actus.js"></script>
  <script>
    /* ---------- Placeholders (SVG intégré, aucun fichier requis) ---------- */
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">' +
      '<rect width="500" height="500" fill="#6b6b6b"/></svg>');

    /* ---------- Catégories ---------- */
    const CATEGORIES = ["Jeu de Société", "Jeu Vidéo", "Jeu Mobile"];
    let categorieActive = "Jeu Vidéo";

    /* ---------- Statuts -> classe CSS de la pastille ---------- */
    const CLASSE_STATUT = {
      "En cours": "en-cours",   // orange
      "Terminé":  "termine",    // vert
      "En pause": "en-pause",   // gris
      "Indisponible": "indisponible"   // rouge
    };

    /* ---------- Ma disponibilité -> classe CSS de la pastille du profil ---------- */
    const CLASSE_DISPO = {
      "Libre":         "libre",         // vert
      "Temps Partiel": "temps-partiel", // orange
      "Indisponible":  "indisponible"   // rouge
    };

    /* ---------- Profil + barre d'XP (= calculateur d'âge) ---------- */
    function setXP(valeur, id = "xpBarre") {   // valeur entre 0 et 1
      const v = Math.min(1, Math.max(0, Number(valeur) || 0));
      document.getElementById(id).style.width = (v * 100) + "%";
    }
    function calculerAge() {
      const { jour, mois, annee } = PROFIL.naissance;   // mois : 1 à 12
      const maintenant = new Date();
      const aujourdhui = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate());

      const anniv = a => new Date(a, mois - 1, jour);   // anniversaire de l'année a
      let derniere = anniv(aujourdhui.getFullYear());
      if (derniere > aujourdhui) derniere = anniv(aujourdhui.getFullYear() - 1);
      const prochain = anniv(derniere.getFullYear() + 1);

      const age = derniere.getFullYear() - annee;
      // 0 = jour de l'anniversaire, tend vers 1 à l'approche du suivant
      const progression = (aujourdhui - derniere) / (prochain - derniere);
      const anniversaire = derniere.getTime() === aujourdhui.getTime();   // aujourd'hui = jour de l'anniversaire
      const jours = Math.round((prochain - aujourdhui) / 864e5);          // jours restants avant le prochain level up
      return { age, progression, jours, anniversaire };
    }
    function afficherProfil() {
      const img = document.getElementById("profilPhoto");
      img.src = PROFIL.photo || PLACEHOLDER;
      img.onerror = () => { img.src = PLACEHOLDER; };
      document.getElementById("profilNom").textContent = PROFIL.nom;

      const dispo = document.getElementById("profilStatut");
      dispo.className = "pastille-profil " + (CLASSE_DISPO[PROFIL.disponibilite] || "indisponible");
      dispo.dataset.tip = PROFIL.disponibilite;      // bulle = ma disponibilité

      const { age, progression } = calculerAge();
      document.getElementById("xpNiveau").textContent = "niv." + age;
      requestAnimationFrame(() => setXP(progression));
    }

    /* ---------- Onglets ---------- */
    function afficherOnglets(animer) {
      const nav = document.getElementById("onglets");
      nav.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "onglet" + (cat === categorieActive ? " actif" : "");
        b.textContent = cat.toUpperCase();
        if (animer && cat === categorieActive) b.classList.add("rebond");
        b.onclick = () => {
          if (cat === categorieActive) { b.classList.add("rebond"); return; }
          categorieActive = cat; afficherOnglets(true); afficherCartouches();
        };
        nav.appendChild(b);
      });
    }

    /* ---------- Médailles (champ "medailles" de projets.js) ---------- */
    const CLASSE_MEDAILLE = { bronze: "bronze", argent: "argent", or: "or" };
    function classeMedaille(type) {
      const t = String(type || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      return CLASSE_MEDAILLE[t] || "bronze";   // type inconnu = bronze
    }
    // remplit `conteneur` avec les médailles du projet ; interactif = survolable avec bulle (page du jeu uniquement)
    function remplirMedailles(conteneur, p, interactif) {
      conteneur.textContent = "";
      const liste = Array.isArray(p.medailles) ? p.medailles : [];
      liste.forEach(m => {
        const el = document.createElement("span");
        el.className = "medaille " + classeMedaille(m.type);
        if (interactif && m.description) {
          el.dataset.medaille = m.description;
          el.setAttribute("aria-label", m.description);
        }
        conteneur.appendChild(el);
      });
      conteneur.hidden = !liste.length;
      return liste.length;
    }

    /* ---------- Tableau des médailles (page profil) : toutes les médailles de tous les projets ---------- */
    const RANG_MEDAILLE = { or: 0, argent: 1, bronze: 2 };   // ordre de rareté : or, puis argent, puis bronze
    function etincelles(parent, n) {
      const alea = (a, b) => a + Math.random() * (b - a);
      for (let i = 0; i < n; i++) {
        const s = document.createElement("i");
        s.className = "etincelle";
        s.style.setProperty("--x", alea(-15, 115).toFixed(0) + "%");
        s.style.setProperty("--y", alea(-15, 115).toFixed(0) + "%");
        s.style.setProperty("--s", alea(8, 16).toFixed(0) + "px");
        s.style.setProperty("--d", alea(0, 3).toFixed(2) + "s");
        s.style.setProperty("--dur", alea(2, 3.4).toFixed(2) + "s");
        parent.appendChild(s);
      }
    }
    function remplirTableauMedailles() {
      const zone = document.getElementById("ppMedailles");
      const grille = document.getElementById("ppMedaillesGrille");
      grille.textContent = "";
      const toutes = [];
      PROJETS.forEach(p => (Array.isArray(p.medailles) ? p.medailles : []).forEach(m => toutes.push({ p, m, cl: classeMedaille(m.type) })));
      toutes.sort((a, b) => RANG_MEDAILLE[a.cl] - RANG_MEDAILLE[b.cl]);   // tri stable : à rareté égale, l'ordre de projets.js est gardé
      toutes.forEach(({ p, m, cl }) => {
        const el = document.createElement("span");
        el.className = "medaille " + cl;
        el.projet = p;                                   // le clic ouvre la page de ce jeu
        el.tabIndex = 0;
        el.setAttribute("role", "button");
        el.setAttribute("aria-label", (m.description ? m.description + " — " : "") + p.nom);
        if (m.description) el.dataset.medaille = m.description;   // bulle de BD au survol
        etincelles(el, cl === "or" ? 4 : 3);                      // étoiles qui brillent devant la médaille
        grille.appendChild(el);
      });
      const ciel = document.getElementById("ppCiel");             // quelques étoiles flottant devant tout le cadre
      ciel.textContent = "";
      etincelles(ciel, 8);
      zone.hidden = !toutes.length;
      requestAnimationFrame(() => majBarreHof());
    }
    function ouvrirProjetDepuisMedaille(el) {
      cacherBulleMedaille();
      ouvrirProjet(el.projet);                           // même fondu au noir que depuis l'accueil
    }
    document.getElementById("ppMedailles").addEventListener("click", e => {
      const el = e.target.closest(".medaille");
      if (el && el.projet) ouvrirProjetDepuisMedaille(el);
    });
    document.getElementById("ppMedailles").addEventListener("keydown", e => {
      const el = e.target.closest(".medaille");
      if (el && el.projet && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ouvrirProjetDepuisMedaille(el); }
    });

    /* ---------- Cartouches ---------- */
    function afficherCartouches() {
      const grille = document.getElementById("grille");
      grille.innerHTML = "";
      grille.scrollTop = 0;
      requestAnimationFrame(() => majBarreGrille());   // barre de défilement du menu (mobile)
      const liste = PROJETS.filter(p => p.type === categorieActive);

      if (!liste.length) {
        grille.innerHTML = '<p class="vide">Aucun projet dans cette catégorie pour le moment.</p>';
        return;
      }

      liste.forEach((p, i) => {
        const c = document.createElement("div");
        c.className = "cartouche entree";
        c.style.setProperty("--i", i);

        const visuel = document.createElement("div");
        visuel.className = "visuel";
        const img = document.createElement("img");
        img.src = p.image || PLACEHOLDER;
        img.alt = p.nom;
        img.onerror = () => { img.src = PLACEHOLDER; };
        visuel.appendChild(img);
        c.dataset.tip = p.nom;               // bulle = nom du projet
        c.projet = p;                        // utilisé par la vitrine 3D

        const pastille = document.createElement("span");
        pastille.className = "pastille " + (CLASSE_STATUT[p.statut] || "en-pause");
        pastille.dataset.tip = p.statut;      // bulle = statut

        c.append(visuel, pastille);

        const medailles = document.createElement("div");   // médailles en bas à gauche (non survolables sur l'accueil)
        medailles.className = "medailles";
        if (remplirMedailles(medailles, p, false)) c.appendChild(medailles);

        grille.appendChild(c);
      });
    }

    /* ---------- Bulle de dialogue (cartouche et pastille) ---------- */
    const bulle = document.getElementById("bulle");
    document.addEventListener("mouseover", e => {
      const el = e.target.closest("[data-tip]");
      if (!el) return;
      bulle.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect();
      bulle.style.left = (r.left + r.width / 2) + "px";
      bulle.style.top = (r.top - bulle.offsetHeight - 14) + "px";
      bulle.classList.add("visible");
    });
    document.addEventListener("mouseout", e => {
      if (e.target.closest("[data-tip]")) bulle.classList.remove("visible");
    });

    /* ---------- Bulle de BD des médailles (page du jeu) : sa queue part de la médaille survolée ---------- */
    const bulleMed = document.getElementById("bulleMedaille");
    function cacherBulleMedaille() { bulleMed.classList.remove("visible"); }
    function placerBulleMedaille(m) {
      const r = m.getBoundingClientRect();
      const bw = bulleMed.offsetWidth, bh = bulleMed.offsetHeight;
      const marge = 10, ecart = 16;
      const cx = r.left + r.width / 2;
      const left = Math.max(marge, Math.min(cx - bw / 2, window.innerWidth - bw - marge));
      const dessous = r.top - bh - ecart < marge;            // pas la place au-dessus : la bulle passe sous la médaille
      bulleMed.style.left = left + "px";
      bulleMed.style.top = (dessous ? r.bottom + ecart : r.top - bh - ecart) + "px";
      bulleMed.style.setProperty("--qx", Math.max(18, Math.min(cx - left, bw - 18)) + "px");   // la queue pointe vers le centre de la médaille
      bulleMed.classList.toggle("bas", dessous);
    }
    document.addEventListener("mouseover", e => {
      const m = e.target.closest("[data-medaille]");
      if (!m) return;
      bulleMed.textContent = m.dataset.medaille;
      placerBulleMedaille(m);
      bulleMed.classList.add("visible");
    });
    document.addEventListener("mousemove", e => {            // la cartouche bouge au survol : on recale la bulle
      const m = e.target.closest("[data-medaille]");
      if (m && bulleMed.classList.contains("visible")) placerBulleMedaille(m);
    });
    document.addEventListener("mouseout", e => {
      const m = e.target.closest("[data-medaille]");
      if (m && !m.contains(e.relatedTarget)) cacherBulleMedaille();
    });
    document.addEventListener("scroll", cacherBulleMedaille, true);
    document.addEventListener("keydown", cacherBulleMedaille);

    /* ---------- Cartouche 3D (CSS 3D pur : aucune librairie, marche en file://) ---------- */
    const vitrine = document.getElementById("vitrine");
    const cartImg = document.createElement("img");
    cartImg.alt = "";
    cartImg.onerror = () => { cartImg.src = PLACEHOLDER; };

    /* contour de la cartouche (0..1) : coins arrondis + coin biseauté en bas à gauche, découpé en segments */
    function contourCartouche() {
      const r = 0.09, n = 4, pts = [];
      const arc = (cx, cy, a0, a1) => {
        for (let k = 0; k <= n; k++) {
          const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180;
          pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
        }
      };
      arc(r, r, 180, 270);           // haut gauche
      arc(1 - r, r, 270, 360);       // haut droite
      arc(1 - r, 1 - r, 0, 90);      // bas droite
      pts.push([0.16, 1], [0, 0.84]);  // biseau en bas à gauche
      return pts.map((p, i) => [p[0], p[1], pts[(i + 1) % pts.length][0], pts[(i + 1) % pts.length][1]]);
    }

        const clair = 74 + 12 * Math.sin(angle);          // petit éclairage factice selon l'orientation
        mur.style.background = "hsl(40 12% " + clair.toFixed(0) + "%)";

    function calculerJauges() {
      const S = PROFIL.stats || {};
      const jauges = [];

      // durée du stage (sert à la jauge Stage et à la jauge Pro)
      let jTotal = 0, jFaits = 0;
      if (S.stage) {
        const debut = lireDate(S.stage.debut), fin = lireDate(S.stage.fin);
        jTotal = Math.max(0, (fin - debut) / MS_JOUR) || 0;
        jFaits = Math.min(jTotal, Math.max(0, (new Date() - debut) / MS_JOUR)) || 0;   // reste pleine après la date de fin
      }
      const MOIS = 365.25 / 12;

      if (S.diplome) {
        const total = Number(S.diplome.anneesTotal) || 0;
        const faites = Math.min(Number(S.diplome.anneesFaites) || 0, total);
        jauges.push({ nom: S.diplome.label || "Diplôme", ratio: total ? faites / total : 0,
                      texte: fmt(faites) + " / " + fmt(total) + " ans", survol: S.diplome.survol });
      }
      if (S.pro) {
        const palier = Number(S.pro.prochainPalier) || 0;
        const valeur = (Number(S.pro.anneesPro) || 0) + jFaits / 365.25;   // années de pro + durée du stage DÉJÀ effectuée (grandit jour après jour)
        jauges.push({ nom: S.pro.label || "Pro (junior)", ratio: palier ? valeur / palier : 0,
                      texte: fmt(valeur) + " / " + fmt(palier) + " ans", survol: S.pro.survol });
      }
      if (S.stage) {
        jauges.push({ nom: S.stage.label || "Stage", ratio: jTotal ? jFaits / jTotal : 0,
                      texte: fmt(jFaits / MOIS, 1) + " / " + fmt(jTotal / MOIS, 1) + " mois", survol: S.stage.survol });
      }
      return jauges;
    }

    async function fonduVers(couleur, total, auMilieu) {

    /* lien YouTube (watch?v=, youtu.be/, embed/, shorts/) -> adresse d'intégration, "" si le lien n'est pas valide */
    function urlEmbedYoutube(lien) {
      if (!lien) return "";
      let u;
      try { u = new URL(String(lien).trim()); } catch (err) { return ""; }
      const hote = u.hostname.replace(/^(www|m)\./, "");
      let id = "";
      if (hote === "youtu.be") id = u.pathname.slice(1).split("/")[0];
      else if (hote === "youtube.com" || hote === "youtube-nocookie.com") {
        if (u.pathname === "/watch") id = u.searchParams.get("v") || "";
        else { const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/); if (m) id = m[2]; }
      }
      if (!/^[\w-]{6,}$/.test(id)) return "";
      const debut = parseInt(u.searchParams.get("t") || u.searchParams.get("start"), 10);
      return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0" + (debut > 0 ? "&start=" + debut : "");
    }

    /* ---------- Texte du jeu : retours à la ligne gardés, *italique*, **gras**, ***gras + italique*** ---------- */
    /* liens dans le texte (actus uniquement) : https://... devient un lien bleu souligné, sauf s'il pointe vers ce projet GitHub */
    const PREFIXE_PROJET_GITHUB = "https://github.com/Mik0ia/BAD_Portfolio";
    function ajouterTexte(parent, t, liens) {
      if (!liens) { parent.append(t); return; }
      const re = /https?:\/\/[^\s<>"'`]+/g;
      let dernier = 0, m;
      while ((m = re.exec(t))) {
        let url = m[0];
        const fin = url.match(/[.,;:!?)\]]+$/);                // ponctuation collée à la fin : elle reste du texte normal
        if (fin) url = url.slice(0, -fin[0].length);
        if (url.toLowerCase().startsWith(PREFIXE_PROJET_GITHUB.toLowerCase())) continue;   // élément de ce projet : pas de lien
        if (m.index > dernier) parent.append(t.slice(dernier, m.index));
        const a = document.createElement("a");
        a.className = "act-lien";
        a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = url;
        parent.appendChild(a);
        dernier = m.index + url.length;
        re.lastIndex = dernier;
      }
      if (dernier < t.length) parent.append(t.slice(dernier));
    }
    function ecrireTexte(parent, texte, liens) {
      const re = /\*\*\*([^*]+?)\*\*\*|\*\*([\s\S]+?)\*\*|\*([^\s*][^*]*?)\*/g;
      let dernier = 0, m;
      while ((m = re.exec(texte))) {
        if (m.index > dernier) ajouterTexte(parent, texte.slice(dernier, m.index), liens);
        if (m[1] != null) {                                   // ***mot***
          const g = document.createElement("strong"), i = document.createElement("em");
          ajouterTexte(i, m[1], liens); g.appendChild(i); parent.appendChild(g);
        } else if (m[2] != null) {                            // **mot** (peut contenir du *italique*)
          const g = document.createElement("strong");
          ecrireTexte(g, m[2], liens); parent.appendChild(g);
        } else {                                              // *mot*
          const i = document.createElement("em");
          ajouterTexte(i, m[3], liens); parent.appendChild(i);
        }
        dernier = re.lastIndex;
      }
      if (dernier < texte.length) ajouterTexte(parent, texte.slice(dernier), liens);
    }

    /* ---------- Zoom d'une image : fond flouté, image en grand, clic en dehors de l'image (ou Échap) = fermer ---------- */
    const zoomImage = document.getElementById("zoomImage"), zoomImg = document.getElementById("zoomImg");
    const zoomOuvert = () => zoomImage.classList.contains("ouvert");
    function ouvrirZoom(im) {
      zoomImg.src = im.currentSrc || im.src;
      zoomImg.style.setProperty("--r", im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 1);
      zoomImage.classList.add("ouvert");
      zoomImage.setAttribute("aria-hidden", "false");
    }
    function fermerZoom() {

    zoomImage.addEventListener("click", e => { if (e.target !== zoomImg) fermerZoom(); });

    /* ---------- Contenu du texte : une ligne qui ne contient QU'UN lien d'image devient une image centrée ---------- */
    const RE_LIGNE_IMAGE = /^\s*(https?:\/\/\S+?\.(?:png|jpe?g|gif|webp|svg|avif|bmp)(?:[?#]\S*?)?)(?:\s*:\s*(\d+(?:[.,]\d+)?))?\s*$/i;   // lien  [ : échelle ]
    function ecrireContenu(parent, brut, opts = {}) {   // opts.liens : liens cliquables | opts.maj : mise à jour de la barre de défilement
      let morceau = [];
      const viderTexte = () => {
        const t = morceau.join("\n").replace(/^\n+|\n+$/g, "");
        morceau = [];
        if (!t) return;
        const seg = document.createElement("div");
        seg.className = "pj-seg";
        ecrireTexte(seg, t, opts.liens);
        parent.appendChild(seg);
      };
      brut.split("\n").forEach(ligne => {
        const m = ligne.match(RE_LIGNE_IMAGE);
        if (!m) { morceau.push(ligne); return; }
        viderTexte();
        const bloc = document.createElement("div");
        bloc.className = "pj-img";
        const im = document.createElement("img");
        im.src = m[1];
        im.alt = "";
        im.loading = "lazy";
        const echelle = m[2] ? parseFloat(m[2].replace(",", ".")) : 1;
        im.addEventListener("load", () => {
          if (echelle > 0 && echelle !== 1 && im.naturalWidth) {                       // échelle : x fois la taille affichée par défaut (taille d'origine, ou largeur du cadre si l'image est plus large)
            im.style.setProperty("--nw", im.naturalWidth + "px");
            im.style.setProperty("--s", echelle);
            im.classList.add("echelle");
          }
          (opts.maj || majBarre)();
        });           // la hauteur de la page change : on remet la barre de défilement à jour
        im.addEventListener("error", () => bloc.remove());       // lien cassé : on n'affiche rien
        im.addEventListener("click", () => ouvrirZoom(im));
        bloc.appendChild(im);
        parent.appendChild(bloc);
      });
      viderTexte();
    }

          if (brut) ecrireContenu(boite, brut, { liens: true, maj: majBarreActus });
          if (src) {
            const cadre = document.createElement("div");
            cadre.className = "pj-video";
            const f = document.createElement("iframe");
            f.title = "Vidéo de l'actualité";
            f.loading = "lazy";
            f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
            f.allowFullscreen = true;
            f.referrerPolicy = "strict-origin-when-cross-origin";
            f.src = src;
            cadre.appendChild(f);
            boite.appendChild(cadre);
          }
          carte.appendChild(boite);
        }

        // 3) boutons de liens
        const boutons = Array.isArray(a.liens) ? a.liens : [];
        const zoneLiens = document.createElement("div");
        zoneLiens.className = "act-liens";
        boutons.forEach(l => {
          if (!l || !l.url || /^\s*javascript:/i.test(l.url)) return;
          const b = document.createElement("a");
          b.className = "pj-lien";
          b.href = l.url; b.target = "_blank"; b.rel = "noopener noreferrer";
          b.textContent = l.nom || l.url;
          if (l.survol) b.dataset.tip = l.survol;
          if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test((l.couleur || "").trim())) b.style.setProperty("--b", l.couleur.trim());
          zoneLiens.appendChild(b);
        });
        if (zoneLiens.children.length) carte.appendChild(zoneLiens);

        actListe.appendChild(carte);
      });
    }
    function viderActus() { actListe.textContent = ""; }     // coupe aussi les vidéos
    function ouvrirActus() {                                 // appelée quand la page apparaît (transition)
      remplirActus();
      marquerActusVues();
      actDefile.scrollTop = 0;
      requestAnimationFrame(() => majBarreActus());
      pageActus.querySelectorAll(".pj-categorie, .btn-fermer, .act").forEach((el, i) => {
        el.style.setProperty("--i", Math.min(i, 6) + 6);
        el.classList.remove("entree"); void el.offsetWidth; el.classList.add("entree");
      });
    }

    /* bouton mégaphone : pastille rouge + secousse tant que les actus (leur contenu) n'ont pas été ouvertes */
    const btnActus = document.getElementById("btnActus");
    const CLE_ACTUS_VUES = "portfolio-actus-vues";
    const signatureActus = () => ACTUS_LISTE.map(a => (a.date || "") + "~" + (a.titre || "")).join("|");
    let actusVuesSession = false;                            // secours si le navigateur refuse localStorage
    function actusNonLues() {
      if (!ACTUS_LISTE.length || actusVuesSession) return false;
      try { return localStorage.getItem(CLE_ACTUS_VUES) !== signatureActus(); } catch (_) { return true; }
    }
    function majBoutonActus() {
      btnActus.hidden = !ACTUS_LISTE.length;
      const nonLu = actusNonLues();
      btnActus.classList.toggle("non-lu", nonLu);
      btnActus.setAttribute("aria-label", nonLu ? "Actualités (nouveautés)" : "Actualités");
    }
    function marquerActusVues() {
      actusVuesSession = true;
      try { localStorage.setItem(CLE_ACTUS_VUES, signatureActus()); } catch (_) {}
      majBoutonActus();
    }
    function secouerBoutonActus() {
      if (!btnActus.classList.contains("non-lu") || btnActus.hidden || enTransition) return;
      if (pageCourante() !== "accueil" || pageProjet.classList.contains("ouverte")) return;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      btnActus.classList.remove("secoue"); void btnActus.offsetWidth; btnActus.classList.add("secoue");
    }
    btnActus.addEventListener("animationend", e => { if (e.animationName === "secoue") btnActus.classList.remove("secoue"); });
    btnActus.addEventListener("click", () => { btnActus.classList.remove("secoue"); bulle.classList.remove("visible"); changerPage("actus"); });
    setTimeout(secouerBoutonActus, 1800);
    setInterval(secouerBoutonActus, 6000);                   // de temps en temps

    /* ---------- Liens de l'accueil (liens_accueil.js) ---------- */
    function copierTexte(texte) {
      const secours = () => {                                                // secours (ex. page ouverte en file://)
        const ta = document.createElement("textarea");
        ta.value = texte; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (_) {}
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).catch(secours);
      else secours();
    }
    const bulleLien = document.getElementById("bulleLien");
    function afficherLiensAccueil() {
      const bloc = document.getElementById("liensAccueil");     // le bloc "Liens" (titre + flèche + liste)
      const nav = document.getElementById("liensListe");        // la liste des boutons, à l'intérieur
      nav.textContent = "";
      const liste = (typeof LIENS_ACCUEIL !== "undefined" && Array.isArray(LIENS_ACCUEIL)) ? LIENS_ACCUEIL : [];
      const urlSure = u => typeof u === "string" && u.trim() && !/^\s*javascript:/i.test(u);
      liste.forEach((l, i) => {
        if (!l) return;
        const page = urlSure(l.page) ? l.page.trim() : "";
        const copie = urlSure(l.copie) ? l.copie.trim() : "";
        if (!l.texte && !page && !copie) return;

        // un seul bouton : lien (nouvel onglet) si "page", simple bouton sinon
        let el;
        if (page) {
          el = document.createElement("a");
          el.href = page; el.target = "_blank"; el.rel = "noopener noreferrer";
        } else {
          el = document.createElement("button");
          el.type = "button";
        }
        el.className = "lien-acc entree";
        el.style.setProperty("--i", i);
        if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test((l.couleur || "").trim())) el.style.setProperty("--b", l.couleur.trim());
        // texte de la bulle au survol : "page" seul = pas de bulle
        const aide = copie ? (page ? "Ouvrir la page et copier le lien" : "Copier le lien") : "";

        if (l.image) {
          const img = document.createElement("img");
          img.src = l.image; img.alt = "";
          img.onerror = () => img.remove();
          el.appendChild(img);
        }
        const t = document.createElement("span");
        t.className = "lien-acc-texte";
        t.textContent = l.texte || page || copie;
        el.appendChild(t);

        const afficher = txt => {                                          // bulle de BD à droite du bouton, queue vers lui
          if (!txt) { bulleLien.classList.remove("visible"); return; }
          bulleLien.textContent = txt;
          const r = el.getBoundingClientRect();
          const w = bulleLien.offsetWidth;
          const gauche = r.right + 18 + w > innerWidth - 8;                // pas la place à droite (mobile : colonne de droite) : la bulle sort à gauche
          bulleLien.classList.toggle("gauche", gauche);
          bulleLien.style.left = (gauche ? r.left - 18 - w : r.right + 18) + "px";
          bulleLien.style.top = (r.top + r.height / 2 - bulleLien.offsetHeight / 2) + "px";
          bulleLien.classList.add("visible");
        };
        el.addEventListener("mouseenter", () => afficher(aide));
        el.addEventListener("mouseleave", () => { clearTimeout(el._retour); bulleLien.classList.remove("visible"); });
        el.addEventListener("focus", () => afficher(aide));
        el.addEventListener("blur", () => bulleLien.classList.remove("visible"));
        if (copie) {
          el.addEventListener("click", () => {                               // copie ET (si "page") ouverture du lien par le navigateur
            copierTexte(copie);
            afficher("Lien copié !");
            clearTimeout(el._retour);
            el._retour = setTimeout(() => {
              if (el.matches(":hover")) afficher(aide); else bulleLien.classList.remove("visible");
            }, 1500);
          });
        }
        nav.appendChild(el);
      });
      bloc.hidden = !nav.children.length;                         // aucun lien = pas de bloc
    }

    /* mobile : mesure la hauteur du haut de l'accueil QUAND "Liens" est fermé ; le menu des jeux garde cette base,
       donc quand "Liens" s'ouvre il est poussé vers le bas au lieu d'être écrasé */
    (function () {
      const haut = document.querySelector(".haut-accueil");
      const bloc = document.getElementById("liensAccueil");
      const mesurer = () => { if (!bloc.classList.contains("ouvert") && haut.offsetHeight) document.documentElement.style.setProperty("--haut-h", haut.offsetHeight + "px"); };
      new ResizeObserver(mesurer).observe(haut);
      addEventListener("resize", mesurer);
    })();

    /* flèche du bloc "Liens" : ouvre / ferme la liste (fermée au chargement) */
    (function () {
      const bloc = document.getElementById("liensAccueil");
      const titre = document.getElementById("liensTitre");
      titre.addEventListener("click", () => {
        const ouvert = bloc.classList.toggle("ouvert");
        titre.setAttribute("aria-expanded", ouvert ? "true" : "false");
        bulleLien.classList.remove("visible");
        if (ouvert) bloc.querySelectorAll(".lien-acc").forEach(b => {          // les boutons ressortent l'un après l'autre
          b.classList.remove("entree"); void b.offsetWidth; b.classList.add("entree");
        });
      });
    })();

    afficherProfil();
    remplirPageProfil();
    afficherLiensAccueil();
    majBoutonActus();
    afficherOnglets();
    afficherCartouches();
  </script>
</body>
</html>
