<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Game Dev & Game Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Profil -->
  <aside class="profil">
    <div class="profil-photo">
      <img id="profilPhoto" alt="Photo de profil">
      <span class="pastille-profil" id="profilStatut"></span>
    </div>
    <div class="profil-nom" id="profilNom"></div>
    <div class="xp">
      <div class="xp-remplissage" id="xpBarre"></div>
      <span class="xp-niveau" id="xpNiveau"></span>
    </div>
    <a class="btn-profil" href="#">&rarr; PROFIL &larr;</a>
  </aside>

  <!-- Catégories + cartouches -->
  <main class="panneau">
    <nav class="onglets" id="onglets"></nav>
    <section class="grille" id="grille"></section>
  </main>

  <!-- Vitrine : grosse cartouche 3D + description (au survol d'une cartouche) -->
  <div class="vitrine" id="vitrine">
    <div class="scene">
      <div class="ombre"></div>
      <div class="cart3d" id="cart3d">
        <div class="flotte"><div class="cart-rot" id="cartRot"></div></div>
      </div>
    </div>
    <div class="desc">
      <div class="desc-titre" id="descTitre"></div>
      <p class="desc-texte" id="descTexte"></p>
    </div>
  </div>

  <!-- Page profil -->
  <section class="page-profil" id="pageProfil" aria-hidden="true">
    <button class="btn-fermer" id="btnFermer" type="button" aria-label="Retour à l'accueil"></button>
    <div class="pp-grille">
      <div class="carte carte-id">
        <div class="pp-photo"><img id="ppPhoto" alt="Photo de profil"><span class="pastille-profil" id="ppStatut"></span></div>
        <h1 class="pp-nom" id="ppNom"></h1>
        <div class="pp-niveau" id="ppNiveau"></div>
      </div>
      <div class="carte"><h2>À propos</h2><p id="ppBio"></p></div>
      <div class="carte"><h2>Compétences</h2><div class="tags" id="ppCompetences"></div></div>
      <div class="carte"><h2>Liens</h2><div class="liens" id="ppLiens"></div></div>
    </div>
  </section>

  <!-- Rideau de transition entre les pages -->
  <div id="rideau" aria-hidden="true">
    <div class="centre">
      <div class="burst-pop" id="rBurst"><div class="burst"></div></div>
      <div class="badge" id="rBadge"></div>
    </div>
  </div>

  <div id="bulle"></div>

  <script src="projets.js"></script>
  <script>
    /* ---------- Placeholders (SVG intégré, aucun fichier requis) ---------- */
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">' +
      '<rect width="500" height="500" fill="#6b6b6b"/></svg>');

    /* ---------- Catégories ---------- */
    const CATEGORIES = ["Jeu de Société", "Jeu Vidéo", "Jeu Mobile"];
    let categorieActive = "Jeu Vidéo";

    /* ---------- Statuts -> classe CSS de la pastille ---------- */
    const CLASSE_STATUT = {
      "En cours": "en-cours",   // orange
      "Terminé":  "termine",    // vert
      "En pause": "en-pause",   // gris
      "Indisponible": "indisponible"   // rouge
    };

    /* ---------- Ma disponibilité -> classe CSS de la pastille du profil ---------- */
    const CLASSE_DISPO = {
      "Libre":         "libre",         // vert
      "Temps Partiel": "temps-partiel", // orange
      "Indisponible":  "indisponible"   // rouge
    };

    /* ---------- Profil + barre d'XP (= calculateur d'âge) ---------- */
    function setXP(valeur) {               // valeur entre 0 et 1
      const v = Math.min(1, Math.max(0, Number(valeur) || 0));
      document.getElementById("xpBarre").style.width = (v * 100) + "%";
    }
    function calculerAge() {
      const { jour, mois, annee } = PROFIL.naissance;   // mois : 1 à 12
      const maintenant = new Date();
      const aujourdhui = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate());

      const anniv = a => new Date(a, mois - 1, jour);   // anniversaire de l'année a
      let derniere = anniv(aujourdhui.getFullYear());
      if (derniere > aujourdhui) derniere = anniv(aujourdhui.getFullYear() - 1);
      const prochain = anniv(derniere.getFullYear() + 1);

      const age = derniere.getFullYear() - annee;
      // 0 = jour de l'anniversaire, tend vers 1 à l'approche du suivant
      const progression = (aujourdhui - derniere) / (prochain - derniere);
      return { age, progression };
    }
    function afficherProfil() {
      const img = document.getElementById("profilPhoto");
      img.src = PROFIL.photo || PLACEHOLDER;
      img.onerror = () => { img.src = PLACEHOLDER; };
      document.getElementById("profilNom").textContent = PROFIL.nom;

      const dispo = document.getElementById("profilStatut");
      dispo.className = "pastille-profil " + (CLASSE_DISPO[PROFIL.disponibilite] || "indisponible");
      dispo.dataset.tip = PROFIL.disponibilite;      // bulle = ma disponibilité

      const { age, progression } = calculerAge();
      document.getElementById("xpNiveau").textContent = "niv." + age;
      requestAnimationFrame(() => setXP(progression));
    }

    /* ---------- Onglets ---------- */
    function afficherOnglets(animer) {
      const nav = document.getElementById("onglets");
      nav.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "onglet" + (cat === categorieActive ? " actif" : "");
        b.textContent = cat.toUpperCase();
        if (animer && cat === categorieActive) b.classList.add("rebond");
        b.onclick = () => {
          if (cat === categorieActive) { b.classList.add("rebond"); return; }
          categorieActive = cat; afficherOnglets(true); afficherCartouches();
        };
        nav.appendChild(b);
      });
    }

    /* ---------- Cartouches ---------- */
    function afficherCartouches() {
      const grille = document.getElementById("grille");
      grille.innerHTML = "";
      const liste = PROJETS.filter(p => p.type === categorieActive);

      if (!liste.length) {
        grille.innerHTML = '<p class="vide">Aucun projet dans cette catégorie pour le moment.</p>';
        return;
      }

      liste.forEach((p, i) => {
        const c = document.createElement("div");
        c.className = "cartouche entree";
        c.style.setProperty("--i", i);

        const visuel = document.createElement("div");
        visuel.className = "visuel";
        const img = document.createElement("img");
        img.src = p.image || PLACEHOLDER;
        img.alt = p.nom;
        img.onerror = () => { img.src = PLACEHOLDER; };
        visuel.appendChild(img);
        c.dataset.tip = p.nom;               // bulle = nom du projet
        c.projet = p;                        // utilisé par la vitrine 3D

        const pastille = document.createElement("span");
        pastille.className = "pastille " + (CLASSE_STATUT[p.statut] || "en-pause");
        pastille.dataset.tip = p.statut;      // bulle = statut

        c.append(visuel, pastille);
        grille.appendChild(c);
      });
    }

    /* ---------- Bulle de dialogue (cartouche et pastille) ---------- */
    const bulle = document.getElementById("bulle");
    document.addEventListener("mouseover", e => {
      const el = e.target.closest("[data-tip]");
      if (!el) return;
      bulle.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect();
      bulle.style.left = (r.left + r.width / 2) + "px";
      bulle.style.top = (r.top - bulle.offsetHeight - 14) + "px";
      bulle.classList.add("visible");
    });
    document.addEventListener("mouseout", e => {
      if (e.target.closest("[data-tip]")) bulle.classList.remove("visible");
    });

    /* ---------- Cartouche 3D (CSS 3D pur : aucune librairie, marche en file://) ---------- */
    const NB_TRANCHES = 32;                   // plus = tranche plus lisse
    const vitrine = document.getElementById("vitrine");
    const cartImg = document.createElement("img");
    cartImg.alt = "";
    cartImg.onerror = () => { cartImg.src = PLACEHOLDER; };

    function construireCartouche3D() {
      const rot = document.getElementById("cartRot");
      // tranche = empilement de silhouettes entre les deux faces
      for (let i = 0; i < NB_TRANCHES; i++) {
        const t = document.createElement("div");
        t.className = "forme tranche";
        const z = (i / (NB_TRANCHES - 1) - 0.5) * 0.96;
        t.style.transform = "translateZ(calc(var(--ep) * " + z.toFixed(4) + "))";
        rot.appendChild(t);
      }
      const avant = document.createElement("div");
      avant.className = "forme face avant";
      const plaque = document.createElement("div");
      plaque.className = "forme plaque";
      const etiquette = document.createElement("div");
      etiquette.className = "etiquette";
      etiquette.appendChild(cartImg);
      plaque.appendChild(etiquette);
      avant.appendChild(plaque);

      const arriere = document.createElement("div");
      arriere.className = "forme face arriere";
      arriere.innerHTML = '<div class="forme plaque"><div class="dos-etiquette"></div><div class="dos-contacts"></div></div>';

      rot.append(avant, arriere);
    }

    let delaiVitrine, projetAffiche = null;
    function afficherVitrine(p, relancer) {
      clearTimeout(delaiVitrine);
      if (relancer) {                         // la cartouche repart de face (rotation à 0)
        const rot = document.getElementById("cartRot");
        rot.style.animation = "none"; void rot.offsetWidth; rot.style.animation = "";
      }
      if (projetAffiche !== p) {
        projetAffiche = p;
        cartImg.src = p.image || PLACEHOLDER;
        document.getElementById("descTitre").textContent = p.nom;
        document.getElementById("descTexte").textContent = p.description || "Pas encore de description.";
      }
      if (!vitrine.classList.contains("visible")) {
        const c3d = document.getElementById("cart3d");
        c3d.classList.remove("pop3d"); void c3d.offsetWidth; c3d.classList.add("pop3d");
      }
      vitrine.classList.add("visible");
    }
    function cacherVitrine() { vitrine.classList.remove("visible"); projetAffiche = null; }

    document.addEventListener("mouseover", e => {
      const c = e.target.closest(".cartouche");
      if (!c || !c.projet) return;
      // on ne relance la rotation qu'en entrant dans la cartouche (pas en bougeant dessus)
      afficherVitrine(c.projet, !c.contains(e.relatedTarget));
    });
    document.addEventListener("mouseout", e => {
      const c = e.target.closest(".cartouche");
      if (!c || (e.relatedTarget && c.contains(e.relatedTarget))) return;
      delaiVitrine = setTimeout(cacherVitrine, 120);   // évite le clignotement entre deux cartouches
    });
    construireCartouche3D();

    /* ---------- Molette = défilement horizontal (sans barre) ---------- */
    document.getElementById("grille").addEventListener("wheel", e => {
      if (!e.deltaY) return;
      e.currentTarget.scrollLeft += e.deltaY;
      bulle.classList.remove("visible");
      e.preventDefault();
    }, { passive: false });

    /* ---------- Rebond cartoon au clic ---------- */
    document.addEventListener("click", e => {
      const el = e.target.closest(".cartouche, .btn-profil, .profil-photo, .profil-nom, .xp");
      if (!el) return;
      el.classList.remove("rebond");
      void el.offsetWidth;               // relance l'animation même si on clique vite
      el.classList.add("rebond");
    });
    document.addEventListener("animationend", e => {
      e.target.classList.remove("rebond", "entree");
    });

    /* ---------- Transition de page (bandes blanches/orange + badge cartoon) ---------- */
    const rideau = document.getElementById("rideau");
    const pageProfil = document.getElementById("pageProfil");
    const rBadge = document.getElementById("rBadge");
    const rBurst = document.getElementById("rBurst");
    const COULEURS_BANDES = ["var(--orange)", "var(--blanc)", "var(--orange-fonce)", "var(--blanc)", "var(--orange)"];
    const bandes = COULEURS_BANDES.map((couleur, i) => {
      const b = document.createElement("div");
      b.className = "bande";
      b.style.top = (i * 20 - 1) + "%";
      b.style.background = couleur;
      rideau.insertBefore(b, rideau.firstChild);
      return b;
    });
    let enTransition = false;
    const pause = ms => new Promise(r => setTimeout(r, ms));
    const COURBE = "cubic-bezier(.7, 0, .3, 1)";

    function remplirPageProfil() {
      const img = document.getElementById("ppPhoto");
      img.src = PROFIL.photo || PLACEHOLDER;
      img.onerror = () => { img.src = PLACEHOLDER; };
      document.getElementById("ppNom").textContent = PROFIL.nom;
      document.getElementById("ppNiveau").textContent = "niv." + calculerAge().age;
      const s = document.getElementById("ppStatut");
      s.className = "pastille-profil " + (CLASSE_DISPO[PROFIL.disponibilite] || "indisponible");
      s.dataset.tip = PROFIL.disponibilite;
      document.getElementById("ppBio").textContent = PROFIL.bio || "";
      const tags = document.getElementById("ppCompetences");
      tags.innerHTML = "";
      (PROFIL.competences || []).forEach(t => { const e = document.createElement("span"); e.className = "tag"; e.textContent = t; tags.appendChild(e); });
      const liens = document.getElementById("ppLiens");
      liens.innerHTML = "";
      (PROFIL.liens || []).forEach(l => { const a = document.createElement("a"); a.className = "lien"; a.href = l.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = l.nom; liens.appendChild(a); });
    }

    function basculerPage(versProfil) {
      pageProfil.classList.toggle("ouverte", versProfil);
      pageProfil.setAttribute("aria-hidden", versProfil ? "false" : "true");
      bulle.classList.remove("visible");
      cacherVitrine();
      if (versProfil) {
        pageProfil.scrollTop = 0;
        pageProfil.querySelectorAll(".carte, .btn-fermer").forEach((el, i) => {
          el.style.setProperty("--i", i + 6);        // les cartes arrivent juste après les bandes
          el.classList.remove("entree"); void el.offsetWidth; el.classList.add("entree");
        });
      }
    }

    async function changerPage(versProfil) {
      if (enTransition || pageProfil.classList.contains("ouverte") === versProfil) return;
      enTransition = true;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { basculerPage(versProfil); enTransition = false; return; }

      const sens = versProfil ? 1 : -1;
      rBadge.textContent = versProfil ? "PROFIL" : "ACCUEIL";
      rideau.classList.add("actif");

      // 1) les bandes entrent en alternant gauche / droite
      bandes.forEach((b, i) => {
        const d = (i % 2 ? -1 : 1) * sens;
        b.animate([{ transform: "translateX(" + (-120 * d) + "%) skewX(-14deg)" },
                   { transform: "translateX(0) skewX(-14deg)" }],
                  { duration: 400, delay: i * 60, easing: COURBE, fill: "both" });
      });
      // 2) étoile + badge qui rebondissent
      const pop = [{ transform: "translate(-50%,-50%) scale(0) rotate(-25deg)" },
                   { transform: "translate(-50%,-50%) scale(1.2) rotate(5deg)", offset: 0.6 },
                   { transform: "translate(-50%,-50%) scale(1) rotate(0)" }];
      await pause(380);
      rBurst.animate(pop, { duration: 460, easing: "ease-out", fill: "both" });
      rBadge.animate(pop, { duration: 460, delay: 70, easing: "ease-out", fill: "both" });
      await pause(520);

      // 3) pendant que tout est couvert : on change de page
      basculerPage(versProfil);
      await pause(260);

      // 4) sortie : badge qui disparaît, bandes qui repartent du côté opposé
      const sortie = [{ transform: "translate(-50%,-50%) scale(1) rotate(0)" },
                      { transform: "translate(-50%,-50%) scale(0) rotate(20deg)" }];
      rBurst.animate(sortie, { duration: 260, easing: "ease-in", fill: "both" });
      rBadge.animate(sortie, { duration: 260, easing: "ease-in", fill: "both" });
      await pause(160);
      const fins = bandes.map((b, i) => {
        const d = (i % 2 ? -1 : 1) * sens;
        return b.animate([{ transform: "translateX(0) skewX(-14deg)" },
                          { transform: "translateX(" + (120 * d) + "%) skewX(-14deg)" }],
                         { duration: 400, delay: i * 60, easing: COURBE, fill: "both" }).finished;
      });
      await Promise.all(fins);

      rideau.getAnimations({ subtree: true }).forEach(a => a.cancel());
      rideau.classList.remove("actif");
      enTransition = false;
    }

    document.querySelectorAll(".profil-photo, .profil-nom, .btn-profil").forEach(el =>
      el.addEventListener("click", e => { e.preventDefault(); changerPage(true); }));
    document.getElementById("btnFermer").addEventListener("click", () => changerPage(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape") changerPage(false); });

    afficherProfil();
    remplirPageProfil();
    afficherOnglets();
    afficherCartouches();
  </script>
</body>
</html>
