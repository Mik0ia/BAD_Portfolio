<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Game Dev & Game Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Profil -->
  <aside class="profil">
    <div class="profil-photo">
      <img id="profilPhoto" alt="Photo de profil">
      <span class="pastille-profil" id="profilStatut"></span>
    </div>
    <div class="profil-nom" id="profilNom"></div>
    <div class="xp">
      <div class="xp-remplissage" id="xpBarre"></div>
      <span class="xp-niveau" id="xpNiveau"></span>
    </div>
    <a class="btn-profil" href="#">&rarr; PROFIL &larr;</a>
  </aside>

  <!-- Catégories + cartouches -->
  <main class="panneau">
    <nav class="onglets" id="onglets"></nav>
    <section class="grille" id="grille"></section>
  </main>

  <!-- Vitrine : grosse cartouche 3D + description (au survol d'une cartouche) -->
  <div class="vitrine" id="vitrine">
    <div class="scene">
      <div class="ombre"></div>
      <div class="cart3d" id="cart3d">
        <div class="flotte"><div class="cart-rot" id="cartRot"></div></div>
      </div>
    </div>
    <div class="desc">
      <div class="desc-titre" id="descTitre"></div>
      <p class="desc-texte" id="descTexte"></p>
    </div>
  </div>

  <!-- Page profil -->
  <section class="page-profil" id="pageProfil" aria-hidden="true">
    <button class="btn-fermer" id="btnFermer" type="button" aria-label="Retour à l'accueil"></button>
    <!-- Gauche : avatar, ombre, pastille de dispo, bulle de dialogue, cadre métier -->
    <div class="pp-avatar-zone">
      <div class="pp-perso">
        <div class="pp-avatar-wrap" tabindex="0">
          <div class="bulle-dialogue" id="ppBulle"></div>
          <div class="ombre-avatar"></div>
          <img id="ppAvatar" alt="Avatar de Benjamin">
          <span class="pastille-profil" id="ppStatut"></span>
        </div>
        <div class="pp-metier" id="ppMetier"></div>
      </div>
    </div>

    <!-- Droite : nom + CV, barre d'XP, cadre Stats (le cadre Skills viendra en dessous) -->
    <div class="pp-droite">
      <div class="pp-ligne-nom">
        <h1 class="pp-nom" id="ppNom"></h1>
        <a class="btn-cv" id="ppCv" href="#" target="_blank" rel="noopener" download data-tip="Télécharger le CV" aria-label="Télécharger le CV">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M4 20h16"/>
          </svg>
        </a>
      </div>
      <div class="xp xp-grande">
        <div class="xp-remplissage" id="ppXpBarre"></div>
        <span class="xp-niveau" id="ppXpNiveau"></span>
      </div>
      <div class="panneau-profil">
        <h2 class="section-titre">- STATS -</h2>
        <div class="jauges" id="ppJauges"></div>
        <div class="brutes" id="ppBrutes"></div>
      </div>
      <!-- cadre Skills : séparé du cadre Stats -->
      <div class="panneau-profil panneau-skills">
        <h2 class="section-titre">- SKILLS -</h2>
        <div class="skills" id="ppSkills"></div>
      </div>
    </div>
  </section>

  <!-- Page projet (style Wii : cadre d'écran + flèches) -->
  <section class="page-projet" id="pageProjet" aria-hidden="true">
    <div class="pj-defile" id="pjDefile">
    <div class="pj-contenu" id="pjContenu">
      <!-- 1) cadre catégorie -->
      <div class="pj-categorie" id="pjType"></div>

      <!-- 2) cadre présentation : cartouche + pastille | nom + description -->
      <div class="pj-cadre-pres">
        <div class="pj-visuel">
          <img id="pjImage" alt="">
          <span class="pastille" id="pjPastille"></span>
        </div>
        <div class="pj-infos">
          <div class="pj-boite pj-nom" id="pjTitre"></div>
          <div class="pj-boite pj-desc" id="pjDesc"></div>
        </div>
      </div>

      <!-- 3) cadre vidéo : disparaît s'il n'y a pas de lien YouTube -->
      <div class="pj-cadre-video" id="pjVideoCadre" hidden>
        <div class="pj-video">
          <iframe id="pjVideo" title="Vidéo de présentation" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </div>
    </div>
    </div>
    <div class="pj-cadre"></div>
    <div class="pj-barre cache" id="pjBarre" aria-hidden="true"><div class="pj-pouce" id="pjPouce"></div></div>
    <button class="btn-fermer" id="pjFermer" type="button" aria-label="Retour à l'accueil"></button>
    <button class="fleche gauche" id="pjPrec" type="button" aria-label="Jeu précédent"></button>
    <button class="fleche droite" id="pjSuiv" type="button" aria-label="Jeu suivant"></button>
    <div class="pj-compteur" id="pjCompteur"></div>
  </section>

  <!-- Fondu (noir pour ouvrir/fermer un projet, blanc pour changer de jeu) -->
  <div id="fondu" aria-hidden="true"></div>

  <!-- Rideau de transition entre les pages -->
  <div id="rideau" aria-hidden="true">
    <div class="centre">
      <div class="burst-pop" id="rBurst"><div class="burst"></div></div>
      <div class="badge" id="rBadge"></div>
    </div>
  </div>

  <div id="bulle"></div>

  <script src="projets.js"></script>
  <script>
    /* ---------- Placeholders (SVG intégré, aucun fichier requis) ---------- */
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">' +
      '<rect width="500" height="500" fill="#6b6b6b"/></svg>');

    /* ---------- Catégories ---------- */
    const CATEGORIES = ["Jeu de Société", "Jeu Vidéo", "Jeu Mobile"];
    let categorieActive = "Jeu Vidéo";

    /* ---------- Statuts -> classe CSS de la pastille ---------- */
    const CLASSE_STATUT = {
      "En cours": "en-cours",   // orange
      "Terminé":  "termine",    // vert
      "En pause": "en-pause",   // gris
      "Indisponible": "indisponible"   // rouge
    };

    /* ---------- Ma disponibilité -> classe CSS de la pastille du profil ---------- */
    const CLASSE_DISPO = {
      "Libre":         "libre",         // vert
      "Temps Partiel": "temps-partiel", // orange
      "Indisponible":  "indisponible"   // rouge
    };

    /* ---------- Profil + barre d'XP (= calculateur d'âge) ---------- */
    function setXP(valeur, id = "xpBarre") {   // valeur entre 0 et 1
      const v = Math.min(1, Math.max(0, Number(valeur) || 0));
      document.getElementById(id).style.width = (v * 100) + "%";
    }
    function calculerAge() {
      const { jour, mois, annee } = PROFIL.naissance;   // mois : 1 à 12
      const maintenant = new Date();
      const aujourdhui = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate());

      const anniv = a => new Date(a, mois - 1, jour);   // anniversaire de l'année a
      let derniere = anniv(aujourdhui.getFullYear());
      if (derniere > aujourdhui) derniere = anniv(aujourdhui.getFullYear() - 1);
      const prochain = anniv(derniere.getFullYear() + 1);

      const age = derniere.getFullYear() - annee;
      // 0 = jour de l'anniversaire, tend vers 1 à l'approche du suivant
      const progression = (aujourdhui - derniere) / (prochain - derniere);
      return { age, progression };
    }
    function afficherProfil() {
      const img = document.getElementById("profilPhoto");
      img.src = PROFIL.photo || PLACEHOLDER;
      img.onerror = () => { img.src = PLACEHOLDER; };
      document.getElementById("profilNom").textContent = PROFIL.nom;

      const dispo = document.getElementById("profilStatut");
      dispo.className = "pastille-profil " + (CLASSE_DISPO[PROFIL.disponibilite] || "indisponible");
      dispo.dataset.tip = PROFIL.disponibilite;      // bulle = ma disponibilité

      const { age, progression } = calculerAge();
      document.getElementById("xpNiveau").textContent = "niv." + age;
      requestAnimationFrame(() => setXP(progression));
    }

    /* ---------- Onglets ---------- */
    function afficherOnglets(animer) {
      const nav = document.getElementById("onglets");
      nav.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "onglet" + (cat === categorieActive ? " actif" : "");
        b.textContent = cat.toUpperCase();
        if (animer && cat === categorieActive) b.classList.add("rebond");
        b.onclick = () => {
          if (cat === categorieActive) { b.classList.add("rebond"); return; }
          categorieActive = cat; afficherOnglets(true); afficherCartouches();
        };
        nav.appendChild(b);
      });
    }

    /* ---------- Cartouches ---------- */
    function afficherCartouches() {
      const grille = document.getElementById("grille");
      grille.innerHTML = "";
      const liste = PROJETS.filter(p => p.type === categorieActive);

      if (!liste.length) {
        grille.innerHTML = '<p class="vide">Aucun projet dans cette catégorie pour le moment.</p>';
        return;
      }

      liste.forEach((p, i) => {
        const c = document.createElement("div");
        c.className = "cartouche entree";
        c.style.setProperty("--i", i);

        const visuel = document.createElement("div");
        visuel.className = "visuel";
        const img = document.createElement("img");
        img.src = p.image || PLACEHOLDER;
        img.alt = p.nom;
        img.onerror = () => { img.src = PLACEHOLDER; };
        visuel.appendChild(img);
        c.dataset.tip = p.nom;               // bulle = nom du projet
        c.projet = p;                        // utilisé par la vitrine 3D

        const pastille = document.createElement("span");
        pastille.className = "pastille " + (CLASSE_STATUT[p.statut] || "en-pause");
        pastille.dataset.tip = p.statut;      // bulle = statut

        c.append(visuel, pastille);
        grille.appendChild(c);
      });
    }

    /* ---------- Bulle de dialogue (cartouche et pastille) ---------- */
    const bulle = document.getElementById("bulle");
    document.addEventListener("mouseover", e => {
      const el = e.target.closest("[data-tip]");
      if (!el) return;
      bulle.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect();
      bulle.style.left = (r.left + r.width / 2) + "px";
      bulle.style.top = (r.top - bulle.offsetHeight - 14) + "px";
      bulle.classList.add("visible");
    });
    document.addEventListener("mouseout", e => {
      if (e.target.closest("[data-tip]")) bulle.classList.remove("visible");
    });

    /* ---------- Cartouche 3D (CSS 3D pur : aucune librairie, marche en file://) ---------- */
    const vitrine = document.getElementById("vitrine");
    const cartImg = document.createElement("img");
    cartImg.alt = "";
    cartImg.onerror = () => { cartImg.src = PLACEHOLDER; };

    /* contour de la cartouche (0..1) : coins arrondis + coin biseauté en bas à gauche, découpé en segments */
    function contourCartouche() {
      const r = 0.09, n = 4, pts = [];
      const arc = (cx, cy, a0, a1) => {
        for (let k = 0; k <= n; k++) {
          const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180;
          pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
        }
      };
      arc(r, r, 180, 270);           // haut gauche
      arc(1 - r, r, 270, 360);       // haut droite
      arc(1 - r, 1 - r, 0, 90);      // bas droite
      pts.push([0.16, 1], [0, 0.84]);  // biseau en bas à gauche
      return pts.map((p, i) => [p[0], p[1], pts[(i + 1) % pts.length][0], pts[(i + 1) % pts.length][1]]);
    }

    function construireCartouche3D() {
      const rot = document.getElementById("cartRot");
      // tranche = vraies parois : un petit rectangle par segment du contour (léger, sans trous ni clignotement)
      contourCartouche().forEach(([x0, y0, x1, y1], i, tous) => {
        const dx = x1 - x0, dy = y1 - y0;
        const longueur = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        const mur = document.createElement("div");
        mur.className = "mur";
        mur.style.width = "calc(var(--c) * " + (longueur + 0.002).toFixed(4) + ")";
        mur.style.transform = "translate3d(calc(var(--c) * " + x0.toFixed(4) + "), calc(var(--c) * " + y0.toFixed(4) +
          "), 0) rotateZ(" + angle.toFixed(4) + "rad) rotateX(90deg)";
        const clair = 74 + 12 * Math.sin(angle);          // petit éclairage factice selon l'orientation
        mur.style.background = "hsl(40 12% " + clair.toFixed(0) + "%)";
        rot.appendChild(mur);
      });
      const avant = document.createElement("div");
      avant.className = "forme face avant";
      const plaque = document.createElement("div");
      plaque.className = "forme plaque";
      const etiquette = document.createElement("div");
      etiquette.className = "etiquette";
      etiquette.appendChild(cartImg);
      plaque.appendChild(etiquette);
      avant.appendChild(plaque);

      const arriere = document.createElement("div");
      arriere.className = "forme face arriere";
      arriere.innerHTML = '<div class="forme plaque"><div class="dos-etiquette"></div><div class="dos-contacts"></div></div>';

      rot.append(avant, arriere);
    }

    let delaiVitrine, projetAffiche = null;
    function afficherVitrine(p, relancer) {
      clearTimeout(delaiVitrine);
      if (relancer) {                         // la cartouche repart de face (rotation à 0)
        const rot = document.getElementById("cartRot");
        rot.style.animation = "none"; void rot.offsetWidth; rot.style.animation = "";
      }
      if (projetAffiche !== p) {
        projetAffiche = p;
        cartImg.src = p.image || PLACEHOLDER;
        document.getElementById("descTitre").textContent = p.nom;
        document.getElementById("descTexte").textContent = p.description || "Pas encore de description.";
      }
      if (!vitrine.classList.contains("visible")) {
        const c3d = document.getElementById("cart3d");
        c3d.classList.remove("pop3d"); void c3d.offsetWidth; c3d.classList.add("pop3d");
      }
      vitrine.classList.add("visible");
    }
    function cacherVitrine() { vitrine.classList.remove("visible"); projetAffiche = null; }

    document.addEventListener("mouseover", e => {
      const c = e.target.closest(".cartouche");
      if (!c || !c.projet) return;
      // on ne relance la rotation qu'en entrant dans la cartouche (pas en bougeant dessus)
      afficherVitrine(c.projet, !c.contains(e.relatedTarget));
    });
    document.addEventListener("mouseout", e => {
      const c = e.target.closest(".cartouche");
      if (!c || (e.relatedTarget && c.contains(e.relatedTarget))) return;
      delaiVitrine = setTimeout(cacherVitrine, 120);   // évite le clignotement entre deux cartouches
    });
    construireCartouche3D();

    /* ---------- Molette = défilement horizontal (sans barre) ---------- */
    document.getElementById("grille").addEventListener("wheel", e => {
      if (!e.deltaY) return;
      e.currentTarget.scrollLeft += e.deltaY;
      bulle.classList.remove("visible");
      e.preventDefault();
    }, { passive: false });

    /* ---------- Rebond cartoon au clic ---------- */
    document.addEventListener("click", e => {
      const el = e.target.closest(".cartouche, .btn-profil, .profil-photo, .profil-nom, .xp, .fleche, .pp-nom, .pp-metier, .pj-visuel");
      if (!el) return;
      el.classList.remove("rebond");
      void el.offsetWidth;               // relance l'animation même si on clique vite
      el.classList.add("rebond");
    });
    document.addEventListener("animationend", e => {
      e.target.classList.remove("rebond", "entree");
    });

    /* ---------- Transition de page (bandes blanches/orange + badge cartoon) ---------- */
    const rideau = document.getElementById("rideau");
    const pageProfil = document.getElementById("pageProfil");
    const rBadge = document.getElementById("rBadge");
    const rBurst = document.getElementById("rBurst");
    const COULEURS_BANDES = ["var(--orange)", "var(--blanc)", "var(--orange-fonce)", "var(--blanc)", "var(--orange)"];
    const bandes = COULEURS_BANDES.map((couleur, i) => {
      const b = document.createElement("div");
      b.className = "bande";
      b.style.top = (i * 20 - 1) + "%";
      b.style.background = couleur;
      rideau.insertBefore(b, rideau.firstChild);
      return b;
    });
    let enTransition = false;
    const pause = ms => new Promise(r => setTimeout(r, ms));
    const COURBE = "cubic-bezier(.7, 0, .3, 1)";

    /* ---------- Stats du profil : calcul des jauges ---------- */
    const MS_JOUR = 864e5;
    const borne = v => Math.min(1, Math.max(0, Number(v) || 0));
    const fmt = (n, d = 2) => Number(n).toLocaleString("en-US", { maximumFractionDigits: d });
    const lireDate = s => { const [a, m, j] = String(s).split("-").map(Number); return new Date(a, (m || 1) - 1, j || 1); };

    // couleur d'une jauge selon sa progression : 0 = rouge, 0.5 = jaune, 1 = vert
    const couleurJauge = r => "hsl(" + Math.round(borne(r) * 120) + " 85% 46%)";

    function calculerJauges() {
      const S = PROFIL.stats || {};
      const jauges = [];

      // durée du stage (sert à la jauge Stage et à la jauge Pro)
      let jTotal = 0, jFaits = 0;
      if (S.stage) {
        const debut = lireDate(S.stage.debut), fin = lireDate(S.stage.fin);
        jTotal = Math.max(0, (fin - debut) / MS_JOUR) || 0;
        jFaits = Math.min(jTotal, Math.max(0, (new Date() - debut) / MS_JOUR)) || 0;   // reste pleine après la date de fin
      }
      const MOIS = 365.25 / 12;

      if (S.diplome) {
        const total = Number(S.diplome.anneesTotal) || 0;
        const faites = Math.min(Number(S.diplome.anneesFaites) || 0, total);
        jauges.push({ nom: S.diplome.label || "Diplôme", ratio: total ? faites / total : 0,
                      texte: fmt(faites) + " / " + fmt(total) + " ans" });
      }
      if (S.pro) {
        const palier = Number(S.pro.prochainPalier) || 0;
        const valeur = (Number(S.pro.anneesPro) || 0) + jFaits / 365.25;   // années de pro + durée du stage DÉJÀ effectuée (grandit jour après jour)
        jauges.push({ nom: S.pro.label || "Pro (junior)", ratio: palier ? valeur / palier : 0,
                      texte: fmt(valeur) + " / " + fmt(palier) + " ans" });
      }
      if (S.stage) {
        jauges.push({ nom: S.stage.label || "Stage", ratio: jTotal ? jFaits / jTotal : 0,
                      texte: fmt(jFaits / MOIS, 1) + " / " + fmt(jTotal / MOIS, 1) + " mois" });
      }
      return jauges;
    }

    /* ---------- Skills ---------- */
    const SKILLS_LISTE = (typeof SKILLS !== "undefined" && Array.isArray(SKILLS)) ? SKILLS : [];
    const cleNiveau = n => String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();   // "Intermédiaire" -> "intermediaire"
    const NIVEAUX = { amateur: "Amateur", intermediaire: "Intermédiaire", expert: "Expert" };

    function remplirSkills() {
      const zone = document.getElementById("ppSkills");
      zone.innerHTML = "";
      SKILLS_LISTE.forEach(s => {
        const cle = NIVEAUX[cleNiveau(s.niveau)] ? cleNiveau(s.niveau) : "amateur";
        const ligne = document.createElement("div");
        ligne.className = "skill " + cle;                       // la classe donne la couleur du cadre (bronze / argent / or)
        ligne.dataset.tip = "Niveau : " + NIVEAUX[cle];         // bulle au survol

        const logo = document.createElement("div");
        logo.className = "skill-logo";
        const img = document.createElement("img");
        img.src = s.image || PLACEHOLDER;
        img.alt = s.nom;
        img.onerror = () => { img.src = PLACEHOLDER; };
        logo.appendChild(img);

        const texte = document.createElement("div");
        const nom = document.createElement("div");
        nom.className = "skill-nom";
        nom.textContent = s.nom;
        const desc = document.createElement("p");
        desc.className = "skill-desc";
        desc.textContent = s.description || "";
        texte.append(nom, desc);

        ligne.append(logo, texte);
        zone.appendChild(ligne);
      });
    }

    function remplirPageProfil() {
      remplirSkills();
      const avatar = document.getElementById("ppAvatar");
      avatar.src = PROFIL.avatar || PLACEHOLDER;
      avatar.onerror = () => { avatar.src = PLACEHOLDER; };
      document.getElementById("ppBulle").textContent = PROFIL.bulle || "";
      document.getElementById("ppMetier").textContent = PROFIL.metier || "";
      document.getElementById("ppNom").textContent = PROFIL.nom;

      const cv = document.getElementById("ppCv");
      if (PROFIL.cv) cv.href = PROFIL.cv; else cv.hidden = true;

      const s = document.getElementById("ppStatut");
      s.className = "pastille-profil " + (CLASSE_DISPO[PROFIL.disponibilite] || "indisponible");
      s.dataset.tip = PROFIL.disponibilite;

      // XP (même calcul que l'accueil, barre agrandie) : la largeur est animée à l'ouverture de la page
      const { age, progression } = calculerAge();
      document.getElementById("ppXpNiveau").textContent = "niv." + age;
      document.getElementById("ppXpBarre").dataset.val = borne(progression);

      // jauges
      const zoneJauges = document.getElementById("ppJauges");
      zoneJauges.innerHTML = "";
      calculerJauges().forEach(j => {
        const ligne = document.createElement("div");
        ligne.className = "jauge";
        ligne.style.setProperty("--j", couleurJauge(j.ratio));
        const nom = document.createElement("span");
        nom.className = "jauge-nom";
        const m = String(j.nom).match(/^(.*?)\s*(\(.*\))\s*$/);   // "Pro (junior)" -> "Pro" + petit "(junior)"
        if (m && m[1]) {
          nom.append(m[1] + " ");
          const petit = document.createElement("small");
          petit.textContent = m[2];
          nom.appendChild(petit);
        } else {
          nom.textContent = j.nom;
        }
        const barre = document.createElement("div");
        barre.className = "jauge-barre";
        const rempli = document.createElement("div");
        rempli.className = "jauge-remplissage";
        rempli.dataset.val = borne(j.ratio);
        const texte = document.createElement("span");
        texte.className = "jauge-texte";
        texte.textContent = j.texte;
        barre.append(rempli, texte);          // le texte est à l'intérieur de la barre, à droite
        ligne.append(nom, barre);
        zoneJauges.appendChild(ligne);
      });

      // statistiques brutes (texte + nombre, tout vient de projets.js)
      const zoneBrutes = document.getElementById("ppBrutes");
      zoneBrutes.innerHTML = "";
      (PROFIL.statsBrutes || []).forEach(st => {
        const t = document.createElement("span");
        t.className = "brute-txt";
        t.textContent = st.texte;
        const v = document.createElement("span");
        v.className = "brute-val";
        // auto: "projets" = nombre de jeux dans PROJETS ; auto: "logiciels" = skills de SKILLS au niveau Expert
        const valeur = st.auto === "projets" ? PROJETS.length
                     : st.auto === "logiciels" ? SKILLS_LISTE.filter(s => cleNiveau(s.niveau) === "expert").length
                     : st.valeur;
        v.textContent = Number.isFinite(Number(valeur)) ? fmt(valeur) : valeur;
        zoneBrutes.append(t, v);
      });
    }

    /* ---------- Clic sur l'avatar : gif "hit" + rebond, puis retour à l'avatar normal ---------- */
    const avatarImg = document.getElementById("ppAvatar");
    const AVATAR_HIT = PROFIL.avatarHit || "";
    const DUREE_COUP = PROFIL.dureeCoup || 1200;
    if (AVATAR_HIT) new Image().src = AVATAR_HIT;       // préchargé pour éviter un temps d'attente au clic
    let enCoup = false;
    avatarImg.draggable = false;
    avatarImg.addEventListener("click", () => {
      if (enCoup || !AVATAR_HIT) return;                // on ignore les clics pendant l'animation
      enCoup = true;
      avatarImg.parentElement.style.setProperty("--duree-coup", DUREE_COUP + "ms");
      avatarImg.src = AVATAR_HIT;
      avatarImg.classList.remove("touche"); void avatarImg.offsetWidth; avatarImg.classList.add("touche");
      setTimeout(() => {
        avatarImg.classList.remove("touche");
        avatarImg.src = PROFIL.avatar || PLACEHOLDER;
        enCoup = false;
      }, DUREE_COUP);
    });

    /* les barres (XP + jauges) repartent de 0 et se remplissent quand la page apparaît */
    let delaiBarres;
    function animerBarres() {
      clearTimeout(delaiBarres);
      const barres = pageProfil.querySelectorAll("[data-val]");
      barres.forEach(b => { b.style.transition = "none"; b.style.width = "0"; });
      void pageProfil.offsetWidth;
      delaiBarres = setTimeout(() => {
        barres.forEach(b => { b.style.transition = ""; b.style.width = (b.dataset.val * 100) + "%"; });
      }, 550);   // laisse le rideau se retirer avant de remplir
    }

    function basculerPage(versProfil) {
      pageProfil.classList.toggle("ouverte", versProfil);
      pageProfil.setAttribute("aria-hidden", versProfil ? "false" : "true");
      bulle.classList.remove("visible");
      cacherVitrine();
      if (versProfil) {
        pageProfil.scrollTop = 0;
        pageProfil.querySelectorAll(".panneau-profil, .btn-fermer, .pp-avatar-wrap, .pp-metier, .pp-ligne-nom, .xp").forEach((el, i) => {
          el.style.setProperty("--i", i + 6);        // les éléments arrivent juste après les bandes
          el.classList.remove("entree"); void el.offsetWidth; el.classList.add("entree");
        });
        animerBarres();
      }
    }

    async function changerPage(versProfil) {
      if (enTransition || pageProfil.classList.contains("ouverte") === versProfil) return;
      enTransition = true;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { basculerPage(versProfil); enTransition = false; return; }

      const sens = versProfil ? 1 : -1;
      rBadge.textContent = versProfil ? "PROFIL" : "ACCUEIL";
      rideau.classList.add("actif");

      // 1) les bandes entrent en alternant gauche / droite
      bandes.forEach((b, i) => {
        const d = (i % 2 ? -1 : 1) * sens;
        b.animate([{ transform: "translateX(" + (-120 * d) + "%) skewX(-14deg)" },
                   { transform: "translateX(0) skewX(-14deg)" }],
                  { duration: 400, delay: i * 60, easing: COURBE, fill: "both" });
      });
      // 2) étoile + badge qui rebondissent
      const pop = [{ transform: "translate(-50%,-50%) scale(0) rotate(-25deg)" },
                   { transform: "translate(-50%,-50%) scale(1.2) rotate(5deg)", offset: 0.6 },
                   { transform: "translate(-50%,-50%) scale(1) rotate(0)" }];
      await pause(380);
      rBurst.animate(pop, { duration: 460, easing: "ease-out", fill: "both" });
      rBadge.animate(pop, { duration: 460, delay: 70, easing: "ease-out", fill: "both" });
      await pause(520);

      // 3) pendant que tout est couvert : on change de page
      basculerPage(versProfil);
      await pause(260);

      // 4) sortie : badge qui disparaît, bandes qui repartent du côté opposé
      const sortie = [{ transform: "translate(-50%,-50%) scale(1) rotate(0)" },
                      { transform: "translate(-50%,-50%) scale(0) rotate(20deg)" }];
      rBurst.animate(sortie, { duration: 260, easing: "ease-in", fill: "both" });
      rBadge.animate(sortie, { duration: 260, easing: "ease-in", fill: "both" });
      await pause(160);
      const fins = bandes.map((b, i) => {
        const d = (i % 2 ? -1 : 1) * sens;
        return b.animate([{ transform: "translateX(0) skewX(-14deg)" },
                          { transform: "translateX(" + (120 * d) + "%) skewX(-14deg)" }],
                         { duration: 400, delay: i * 60, easing: COURBE, fill: "both" }).finished;
      });
      await Promise.all(fins);

      rideau.getAnimations({ subtree: true }).forEach(a => a.cancel());
      rideau.classList.remove("actif");
      enTransition = false;
    }

    document.querySelectorAll(".profil-photo, .profil-nom, .btn-profil").forEach(el =>
      el.addEventListener("click", e => { e.preventDefault(); changerPage(true); }));
    document.getElementById("btnFermer").addEventListener("click", () => changerPage(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape") changerPage(false); });

    /* ---------- Bouton CV : télécharge le PDF, sinon l'ouvre dans un autre onglet (jamais sur la page du portfolio) ---------- */
    document.getElementById("ppCv").addEventListener("click", async e => {
      e.preventDefault();
      const url = PROFIL.cv;
      if (!url) return;
      const nomFichier = decodeURIComponent(url.split("?")[0].split("/").pop()) || "CV.pdf";
      try {
        const rep = await fetch(url);
        if (!rep.ok) throw new Error("HTTP " + rep.status);
        const blob = await rep.blob();                    // le fichier est récupéré puis enregistré : le navigateur ne l'affiche pas
        const lien = document.createElement("a");
        lien.href = URL.createObjectURL(blob);
        lien.download = nomFichier;
        document.body.appendChild(lien);
        lien.click();
        lien.remove();
        setTimeout(() => URL.revokeObjectURL(lien.href), 5000);
      } catch (err) {
        window.open(url, "_blank", "noopener");           // repli : nouvel onglet
      }
    });

    /* ---------- Page projet : fondus noir / blanc ---------- */
    const DUREE_NOIR  = 1000;   // ms au total : ouvrir / fermer un projet (fondu au noir, aller + retour)
    const DUREE_BLANC = 500;    // ms au total : changer de jeu avec les flèches (fondu au blanc)
    const pageProjet = document.getElementById("pageProjet");
    const fondu = document.getElementById("fondu");

    async function fonduVers(couleur, total, auMilieu) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { auMilieu(); return; }
      const demi = total / 2;
      fondu.style.background = couleur;
      fondu.classList.add("actif");
      await fondu.animate([{ opacity: 0 }, { opacity: 1 }], { duration: demi, easing: "ease-in", fill: "both" }).finished;
      auMilieu();                                   // l'écran est entièrement couvert
      await fondu.animate([{ opacity: 1 }, { opacity: 0 }], { duration: demi, easing: "ease-out", fill: "both" }).finished;
      fondu.getAnimations().forEach(a => a.cancel());
      fondu.classList.remove("actif");
    }

    let projetCourant = null;
    const memeCategorie = p => PROJETS.filter(x => x.type === p.type);

    /* lien YouTube (watch?v=, youtu.be/, embed/, shorts/) -> adresse d'intégration, "" si le lien n'est pas valide */
    function urlEmbedYoutube(lien) {
      if (!lien) return "";
      let u;
      try { u = new URL(String(lien).trim()); } catch (err) { return ""; }
      const hote = u.hostname.replace(/^(www|m)\./, "");
      let id = "";
      if (hote === "youtu.be") id = u.pathname.slice(1).split("/")[0];
      else if (hote === "youtube.com" || hote === "youtube-nocookie.com") {
        if (u.pathname === "/watch") id = u.searchParams.get("v") || "";
        else { const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/); if (m) id = m[2]; }
      }
      if (!/^[\w-]{6,}$/.test(id)) return "";
      const debut = parseInt(u.searchParams.get("t") || u.searchParams.get("start"), 10);
      return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0" + (debut > 0 ? "&start=" + debut : "");
    }

    function remplirProjet(p) {
      projetCourant = p;
      const img = document.getElementById("pjImage");
      img.src = p.image || PLACEHOLDER;
      img.alt = p.nom;
      img.onerror = () => { img.src = PLACEHOLDER; };
      document.getElementById("pjType").textContent = p.type;
      document.getElementById("pjTitre").textContent = p.nom;
      const pastille = document.getElementById("pjPastille");
      pastille.className = "pastille " + (CLASSE_STATUT[p.statut] || "en-pause");   // même pastille que sur l'accueil
      pastille.dataset.tip = p.statut;
      document.getElementById("pjDesc").textContent = p.description || "Pas encore de description.";

      // vidéo YouTube : le cadre n'apparaît que si un lien valide est renseigné (champ "video" dans projets.js)
      const src = urlEmbedYoutube(p.video);
      document.getElementById("pjVideoCadre").hidden = !src;
      if (src) document.getElementById("pjVideo").src = src;
      else document.getElementById("pjVideo").removeAttribute("src");

      const liste = memeCategorie(p);
      document.getElementById("pjCompteur").textContent = (liste.indexOf(p) + 1) + " / " + liste.length;
      pageProjet.classList.toggle("seul", liste.length < 2);   // une seule entrée : pas de flèches

      const contenu = document.getElementById("pjContenu");
      document.getElementById("pjDefile").scrollTop = 0;
      majBarre();
      contenu.classList.remove("entree"); void contenu.offsetWidth; contenu.classList.add("entree");
    }

    async function ouvrirProjet(p) {
      if (enTransition || pageProjet.classList.contains("ouverte")) return;
      enTransition = true;
      await fonduVers("#000", DUREE_NOIR, () => {
        bulle.classList.remove("visible");
        cacherVitrine();
        remplirProjet(p);
        pageProjet.classList.add("ouverte");
        pageProjet.setAttribute("aria-hidden", "false");
      });
      enTransition = false;
    }
    async function fermerProjet() {
      if (enTransition || !pageProjet.classList.contains("ouverte")) return;
      enTransition = true;
      await fonduVers("#000", DUREE_NOIR, () => {
        pageProjet.classList.remove("ouverte");
        pageProjet.setAttribute("aria-hidden", "true");
        document.getElementById("pjVideo").removeAttribute("src");   // coupe la vidéo
      });
      enTransition = false;
    }
    async function changerDeJeu(sens) {                    // sens : +1 suivant, -1 précédent
      if (enTransition || !projetCourant) return;
      const liste = memeCategorie(projetCourant);
      if (liste.length < 2) return;
      const suivant = liste[(liste.indexOf(projetCourant) + sens + liste.length) % liste.length];
      enTransition = true;
      await fonduVers("#fff", DUREE_BLANC, () => remplirProjet(suivant));
      enTransition = false;
    }

    document.getElementById("grille").addEventListener("click", e => {
      const c = e.target.closest(".cartouche");
      if (c && c.projet) ouvrirProjet(c.projet);
    });
    document.getElementById("pjFermer").addEventListener("click", fermerProjet);
    document.getElementById("pjPrec").addEventListener("click", () => changerDeJeu(-1));
    document.getElementById("pjSuiv").addEventListener("click", () => changerDeJeu(1));
    document.addEventListener("keydown", e => {
      if (!pageProjet.classList.contains("ouverte")) return;
      if (e.key === "Escape") fermerProjet();
      else if (e.key === "ArrowLeft") changerDeJeu(-1);
      else if (e.key === "ArrowRight") changerDeJeu(1);
      else if (e.key === "ArrowDown") pjDefile.scrollBy({ top: 90, behavior: "smooth" });
      else if (e.key === "ArrowUp") pjDefile.scrollBy({ top: -90, behavior: "smooth" });
      else if (e.key === "PageDown") pjDefile.scrollBy({ top: pjDefile.clientHeight * 0.85, behavior: "smooth" });
      else if (e.key === "PageUp") pjDefile.scrollBy({ top: -pjDefile.clientHeight * 0.85, behavior: "smooth" });
    });

    /* ---------- Barre de défilement cartoon (page projet) ---------- */
    const pjDefile = document.getElementById("pjDefile");
    const pjBarre = document.getElementById("pjBarre");
    const pjPouce = document.getElementById("pjPouce");
    const MARGE_BARRE = 2;                                  // espace entre la barre et le pouce
    function majBarre() {
      const defile = pjDefile.scrollHeight - pjDefile.clientHeight;
      pjBarre.classList.toggle("cache", defile <= 1);       // rien à défiler : on cache la barre
      if (defile <= 1) return;
      const h = pjBarre.clientHeight - MARGE_BARRE * 2;
      const th = Math.max(44, Math.min(h, h * pjDefile.clientHeight / pjDefile.scrollHeight));
      pjPouce.style.height = th + "px";
      pjPouce.style.top = (MARGE_BARRE + pjDefile.scrollTop / defile * (h - th)) + "px";
    }
    let glisse = null;
    pjPouce.addEventListener("pointerdown", e => {          // glisser le pouce
      glisse = { y: e.clientY, st: pjDefile.scrollTop };
      pjPouce.setPointerCapture(e.pointerId);
      pjPouce.classList.add("saisi");
      e.preventDefault();
    });
    pjPouce.addEventListener("pointermove", e => {
      if (!glisse) return;
      const defile = pjDefile.scrollHeight - pjDefile.clientHeight;
      const libre = pjBarre.clientHeight - MARGE_BARRE * 2 - pjPouce.offsetHeight;
      if (libre > 0) pjDefile.scrollTop = glisse.st + (e.clientY - glisse.y) * defile / libre;
    });
    const finGlisse = () => { glisse = null; pjPouce.classList.remove("saisi"); };
    pjPouce.addEventListener("pointerup", finGlisse);
    pjPouce.addEventListener("pointercancel", finGlisse);
    pjBarre.addEventListener("pointerdown", e => {          // clic dans la barre : une page vers le haut / le bas
      if (e.target !== pjBarre) return;
      const r = pjPouce.getBoundingClientRect();
      pjDefile.scrollBy({ top: (e.clientY < r.top ? -1 : 1) * pjDefile.clientHeight * 0.85, behavior: "smooth" });
    });
    pjDefile.addEventListener("scroll", majBarre, { passive: true });
    new ResizeObserver(majBarre).observe(pjDefile);
    new ResizeObserver(majBarre).observe(document.getElementById("pjContenu"));
    addEventListener("resize", majBarre);
    // la molette fait aussi défiler la page quand la souris est sur le cadre ou les boutons
    pageProjet.addEventListener("wheel", e => { if (!pjDefile.contains(e.target)) pjDefile.scrollTop += e.deltaY; }, { passive: true });

    afficherProfil();
    remplirPageProfil();
    afficherOnglets();
    afficherCartouches();
  </script>
</body>
</html>
